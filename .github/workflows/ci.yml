name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4 # keep in sync with GOLANGCI_LINT_VERSION in the Makefile

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '23' # exact pin for local dev lives in .mise.toml
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: make web-install

      - name: Typecheck
        run: make web-check

      - name: Test
        run: make web-test
