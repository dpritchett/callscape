<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="callscape">
  <!--
    The thing itself, from outside: a crust of districts on a dark sphere.

    Sized for 16 pixels, which is the only size that matters and is unforgiving.
    The first version drew five districts, a wire and a limb highlight, all of
    which came out around two pixels across and added up to a smudge. This is
    four shapes: the sphere, and three districts big enough to still be shapes.

    The bright rim does the real work. A dark circle on a dark background is a
    hole; a dark circle with a lit edge is an object, and it survives a light
    tab strip as well as a dark one, which no fill alone does.
  -->
  <defs>
    <clipPath id="globe">
      <circle cx="16" cy="16" r="14"/>
    </clipPath>
  </defs>

  <circle cx="16" cy="16" r="14" fill="#0d1220"/>

  <!-- Districts, clipped to the sphere so they read as being on it rather than
       floating past the edge. Foreshortened towards the limb, as the real caps
       are, and taking up most of the face — at this size, subtle is invisible. -->
  <g clip-path="url(#globe)">
    <ellipse cx="12" cy="10.5" rx="8" ry="6" fill="#7aa2f7" transform="rotate(-20 12 10.5)"/>
    <ellipse cx="22" cy="19" rx="6.5" ry="4.6" fill="#9ece6a" transform="rotate(28 22 19)"/>
    <ellipse cx="12.5" cy="23" rx="5.6" ry="3.6" fill="#e0af68" transform="rotate(12 12.5 23)"/>
  </g>

  <circle cx="16" cy="16" r="14" fill="none" stroke="#c0caf5" stroke-width="2.5"/>
</svg>
